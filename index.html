<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebastian &amp; Hui Xin – Wedding Invitation</title>

  <!-- Elegant serif + light sans-serif from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================
       Base & Background
    ===================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blush:    #f9d5e5;
      --rose:     #e8a0b4;
      --lavender: #dcc6e0;
      --lilac:    #c9a9d3;
      --cream:    #fff8f0;
      --sage:     #cce0c8;
      --gold:     #c9a96e;
      --dark:     #5c3d4a;
      --wax-deep: #6f1632;
      --wax-mid:  #8f1f3f;
      --wax-lite: #b4425b;
      --leaf:     #7ea87a;
      --ink:      #b66b86;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 20%, #fce8f0 0%, #f5e6ff 40%, #fdeaf2 70%, #f0f8ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
    }

    /* =====================================================
       Decorative floating petals (background)
    ===================================================== */
    .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .petal {
      position: absolute;
      border-radius: 50% 50% 50% 0;
      opacity: 0.35;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translateY(-60px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.35; }
      90%  { opacity: 0.35; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* =====================================================
       Scene & perspective
    ===================================================== */
    .scene {
      position: relative;
      z-index: 1;
      perspective: 1400px;
      width: min(420px, 92vw);
    }

    /* =====================================================
       Card wrapper — holds inner content revealed behind doors
    ===================================================== */
    .card-wrapper {
      position: relative;
      width: 100%;
      /* ratio roughly A5 portrait */
      padding-top: 130%;
      cursor: pointer;
      user-select: none;
    }

    /* =====================================================
       Inner card (the revealed invitation text)
    ===================================================== */
    .card-inner {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      /*
        PHOTO BACKGROUND: Replace 'couple.jpg' with the path to your couple photo.
        The semi-transparent cream overlay keeps text readable over any photo.
        If the photo is not found, the soft cream colour shows as a fallback.
      */
      background:
        linear-gradient(rgba(255,248,240,0.84), rgba(255,248,240,0.84)),
        url('couple.jpg') center / cover no-repeat,
        var(--cream);
      border: 2px solid var(--rose);
      box-shadow: 0 12px 50px rgba(200, 120, 150, 0.22), 0 4px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 28px 28px;
      gap: 18px;
      overflow: hidden;
    }

    /* SVG floral corner decorations inside card */
    .floral-corner {
      position: absolute;
      width: 130px;
      height: 130px;
      opacity: 0.82;
    }
    .floral-corner.tl { top: -10px;  left: -10px;  transform: rotate(0deg); }
    .floral-corner.tr { top: -10px;  right: -10px; transform: rotate(90deg); }
    .floral-corner.bl { bottom: -10px; left: -10px;  transform: rotate(270deg); }
    .floral-corner.br { bottom: -10px; right: -10px; transform: rotate(180deg); }

    .rose-outline * {
      vector-effect: non-scaling-stroke;
    }

    .monogram {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      font-weight: 300;
      letter-spacing: 0.25em;
      color: var(--lilac);
      text-transform: uppercase;
    }

    .divider {
      width: 60%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--rose), transparent);
    }

    .invite-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
      font-weight: 300;
      font-style: italic;
      color: var(--dark);
      text-align: center;
      line-height: 1.7;
      letter-spacing: 0.03em;
    }
    .invite-heading strong {
      font-weight: 600;
      font-style: normal;
      color: var(--dark);
    }

    .cta-text {
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      letter-spacing: 0.12em;
      color: var(--rose);
      text-align: center;
      font-weight: 300;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease 0.6s, transform 0.8s ease 0.6s;
    }
    .cta-text .arrow {
      display: inline-block;
      animation: bounce 1.4s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(4px); }
    }

    /* =====================================================
       The two door panels (front of the envelope/card)
    ===================================================== */
    .doors {
      position: absolute;
      inset: 0;
      pointer-events: none; /* card-wrapper handles click */
    }

    .door {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(160deg, #fde8f0 0%, #f5d5e8 40%, #ead0ee 100%);
      border: 2px solid var(--rose);
      overflow: hidden;
      transition: transform 1.1s cubic-bezier(0.4, 0.0, 0.2, 1),
                  box-shadow 1.1s ease;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      will-change: transform;
      z-index: 2;
    }
    .door.left {
      left: 0;
      border-radius: 18px 0 0 18px;
      transform-origin: left center;
      border-right: 1px solid var(--rose);
    }
    .door.right {
      right: 0;
      border-radius: 0 18px 18px 0;
      transform-origin: right center;
      border-left: 1px solid var(--rose);
    }

    /* Door face content */
    .door-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
    }

    /* Sealing wax / centre crest visible before opening */
    .wax-seal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 86px;
      height: 86px;
      border-radius: 50%;
      z-index: 3;
      pointer-events: none;

      /* Deep red classic wax look */
      background:
        radial-gradient(circle at 30% 26%, rgba(255,255,255,0.38) 0 16%, transparent 17% 100%),
        radial-gradient(circle at 68% 72%, rgba(0,0,0,0.28) 0 32%, transparent 58% 100%),
        radial-gradient(circle at 42% 36%, var(--wax-lite) 0%, var(--wax-mid) 38%, var(--wax-deep) 100%);

      box-shadow:
        0 12px 22px rgba(60, 8, 24, 0.42),
        0 3px 0 rgba(255,255,255,0.14) inset;

      filter: drop-shadow(0 3px 2px rgba(0,0,0,0.20));

      /* Classic wax stamp shape — 12 evenly-spaced lobes */
      clip-path: polygon(
        50% 0%,   56% 5%,  63% 2%,  67% 8%,  74% 6%,
        77% 13%,  84% 12%, 86% 19%, 93% 19%, 94% 27%,
        100% 29%, 99% 37%, 100% 50%,99% 63%, 100% 71%,
        94% 73%, 93% 81%, 86% 81%, 84% 88%, 77% 87%,
        74% 94%, 67% 92%, 63% 98%, 56% 95%,
        50% 100%,44% 95%, 37% 98%, 33% 92%, 26% 94%,
        23% 87%, 16% 88%, 14% 81%, 7% 81%, 6% 73%,
        0% 71%,  1% 63%,  0% 50%,  1% 37%,  0% 29%,
        6% 27%,  7% 19%,  14% 19%, 16% 12%, 23% 13%,
        26% 6%,  33% 8%,  37% 2%,  44% 5%
      );

      display: grid;
      place-items: center;
      overflow: visible;
    }

    /* subtle pressed wax texture */
    .wax-seal::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 22% 28%, rgba(255,255,255,0.10) 0 12%, transparent 13% 100%),
        radial-gradient(circle at 72% 62%, rgba(0,0,0,0.12) 0 14%, transparent 15% 100%),
        repeating-radial-gradient(circle at 42% 44%,
          rgba(255,255,255,0.05) 0 2px,
          rgba(0,0,0,0.04) 2px 4px
        );
      transform: rotate(-8deg);
      opacity: 0.80;
      mix-blend-mode: overlay;
      border-radius: 50%;
    }

    /* The SVG stamp impression sits on top of the wax */
    .wax-seal .seal-svg {
      position: relative;
      width: 80px;
      height: 80px;
      z-index: 1;
    }

    /* Door SVG floral */
    .door-floral {
      width: 90%;
      height: auto;
      opacity: 0.5;
    }

    .door-hint {
      position: absolute;
      bottom: 18px;
      left: 0; right: 0;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--dark);
      opacity: 0.6;
      text-transform: uppercase;
    }

    /* ===== Open state ===== */
    .card-wrapper.open .door.left {
      transform: perspective(1400px) rotateY(-118deg);
      box-shadow: -12px 0 40px rgba(180, 80, 120, 0.18);
    }
    .card-wrapper.open .door.right {
      transform: perspective(1400px) rotateY(118deg);
      box-shadow: 12px 0 40px rgba(180, 80, 120, 0.18);
    }
    .card-wrapper.open .wax-seal {
      animation: sealFade 0.3s ease forwards;
    }
    @keyframes sealFade {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    }
    .card-wrapper.open .cta-text {
      opacity: 1;
      transform: translateY(0);
    }

    /* Ripple on click */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(232, 160, 180, 0.35);
      transform: scale(0);
      animation: rippleAnim 0.6s linear forwards;
      pointer-events: none;
      z-index: 10;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    /* =====================================================
       RSVP button (shown after card opens)
    ===================================================== */
    .rsvp-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--wax-mid), var(--wax-deep));
      color: rgba(255,248,245,0.96);
      padding: 10px 26px;
      border-radius: 30px;
      text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.85rem, 2.8vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 6px 18px rgba(111, 22, 50, 0.32);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.8s ease 1.0s, transform 0.8s ease 1.0s,
                  background 0.3s ease, box-shadow 0.3s ease;
      pointer-events: none;
    }
    .rsvp-btn svg { flex-shrink: 0; }
    .rsvp-btn:hover {
      background: linear-gradient(135deg, var(--wax-lite), var(--wax-mid));
      box-shadow: 0 8px 22px rgba(111, 22, 50, 0.44);
    }
    .card-wrapper.open .rsvp-btn {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
  </style>
</head>

<script>
  /* ============================================================
     Configuration — replace WEDDING_URL with the actual page
  ============================================================ */
  const WEDDING_URL = 'https://example.com/wedding-details'; // ← update this URL

  // Wire WEDDING_URL to the RSVP button
  document.getElementById('rsvpBtn').href = WEDDING_URL;

  /* ============================================================
     Floating petals
  ============================================================ */
  (function spawnPetals() {
    const container = document.getElementById('petals');
    const colours = ['#f9d5e5','#dcc6e0','#cce0c8','#fde8d8','#e8d5f0'];
    const sizes   = [8, 10, 12, 14, 7, 9];

    for (let i = 0; i < 28; i++) {
      const el = document.createElement('div');
      el.classList.add('petal');
      const size = sizes[Math.floor(Math.random() * sizes.length)];
      el.style.cssText = [
        `width:${size}px`,
        `height:${size * 1.2}px`,
        `left:${Math.random() * 100}%`,
        `background:${colours[Math.floor(Math.random() * colours.length)]}`,
        `animation-duration:${8 + Math.random() * 14}s`,
        `animation-delay:${-Math.random() * 20}s`,
        `border-radius:${40 + Math.random() * 30}% ${60 - Math.random() * 20}% ${50 + Math.random() * 20}% ${30 + Math.random() * 20}%`
      ].join(';');
      container.appendChild(el);
    }
  }());

  /* ============================================================
     Door-opening interaction
  ============================================================ */
  const card = document.getElementById('card');
  let opened = false;

  function triggerRipple(e) {
    const rect = card.getBoundingClientRect();
    const x = (e.clientX || rect.left + rect.width  / 2) - rect.left;
    const y = (e.clientY || rect.top  + rect.height / 2) - rect.top;
    const ripple = document.createElement('div');
    ripple.classList.add('ripple');
    const size = Math.max(rect.width, rect.height) * 0.6;
    ripple.style.cssText = `
      width:${size}px; height:${size}px;
      left:${x - size / 2}px; top:${y - size / 2}px;
    `;
    card.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  }

  function openCard(e) {
    if (opened) return;
    opened = true;

    triggerRipple(e);

    // Add open class — CSS handles the 3-D door swing
    card.classList.add('open');
  }

  card.addEventListener('click', openCard);
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(e); }
  });

  // Prevent RSVP button clicks from bubbling to the card-wrapper
  document.getElementById('rsvpBtn').addEventListener('click', (e) => {
    e.stopPropagation();
  });
</script>
