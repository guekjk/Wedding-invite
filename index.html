<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebastian &amp; Hui Xin – Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blush:    #f9d5e5;
      --rose:     #e8a0b4;
      --lavender: #dcc6e0;
      --lilac:    #c9a9d3;
      --cream:    #fff8f0;
      --sage:     #cce0c8;
      --gold:     #c9a96e;
      --dark:     #5c3d4a;
      --wax-deep: #6f1632;
      --wax-mid:  #8f1f3f;
      --wax-lite: #b4425b;
      --leaf:     #7ea87a;
      --ink:      #b66b86;

      /* Envelope geometry — flap height × clip tip-y = seal position
         flap-height(47%) × clip-tip-y(87%) = 40.89% ≈ 40.9% */
      --flap-height:  47%;
      --seal-top:     40.9%;

      /* Animation sequence timings */
      --t-seal-fade:  0.28s;   /* seal crumbles */
      --t-flap-delay: 0.26s;   /* flap starts after seal */
      --t-flap-dur:   0.94s;   /* flap rotation duration */
      --t-env-delay:  1.05s;   /* envelope fade starts */
      --t-env-dur:    0.55s;   /* envelope fade duration */
      --t-card-delay: 1.5s;    /* invite card appears */
      --t-cta-delay:  2.2s;    /* cta text appears */
      --t-btn-delay:  2.4s;    /* rsvp button appears */
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 20%, #fce8f0 0%, #f5e6ff 40%, #fdeaf2 70%, #f0f8ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
    }

    /* =====================================================
       Bubbles (background animation)
    ===================================================== */
    .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .bubble {
      position: absolute;
      bottom: -80px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 35% 30%,
        rgba(255,255,255,0.82) 0%,
        rgba(255,210,235,0.20) 55%,
        transparent 100%
      );
      border: 1.2px solid rgba(255,255,255,0.62);
      animation: bubbleRise linear infinite;
    }
    @keyframes bubbleRise {
      0%   { transform: translateY(0)       translateX(0);             opacity: 0;  }
      8%   { opacity: 0.82; }
      50%  { transform: translateY(-50vh)    translateX(var(--drift));  }
      92%  { opacity: 0.55; }
      100% { transform: translateY(-115vh)   translateX(var(--drift2)); opacity: 0; }
    }

    /* =====================================================
       Scene & perspective
    ===================================================== */
    .scene {
      position: relative;
      z-index: 1;
      perspective: 1400px;
      width: min(380px, 92vw);
    }

    /* =====================================================
       Card wrapper
    ===================================================== */
    .card-wrapper {
      position: relative;
      width: 100%;
      padding-top: 140%;
      cursor: pointer;
      user-select: none;
    }

    /* =====================================================
       Inner invite card (revealed after envelope opens)
    ===================================================== */
    .card-inner {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background:
        linear-gradient(rgba(255,248,240,0.88), rgba(255,248,240,0.88)),
        url('couple.jpg') center / cover no-repeat,
        var(--cream);
      border: 2px solid var(--rose);
      box-shadow: 0 12px 50px rgba(200,120,150,0.22), 0 4px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 28px 28px;
      gap: 16px;
      overflow: hidden;
      z-index: 1;
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      transition: opacity 0.8s ease var(--t-card-delay), transform 0.8s ease var(--t-card-delay);
    }
    .card-wrapper.open .card-inner {
      opacity: 1;
      transform: none;
    }

    .floral-corner {
      position: absolute;
      width: 125px;
      height: 125px;
      opacity: 0.82;
    }
    .floral-corner.tl { top: -8px;   left: -8px;  transform: rotate(0deg); }
    .floral-corner.tr { top: -8px;   right: -8px; transform: rotate(90deg); }
    .floral-corner.bl { bottom: -8px; left: -8px;  transform: rotate(270deg); }
    .floral-corner.br { bottom: -8px; right: -8px; transform: rotate(180deg); }

    .monogram {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      font-weight: 300;
      letter-spacing: 0.25em;
      color: var(--lilac);
      text-transform: uppercase;
    }

    .divider {
      width: 60%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--rose), transparent);
    }

    .invite-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
      font-weight: 300;
      font-style: italic;
      color: var(--dark);
      text-align: center;
      line-height: 1.7;
      letter-spacing: 0.03em;
    }
    .invite-heading strong {
      font-weight: 600;
      font-style: normal;
      color: var(--dark);
    }

    .cta-text {
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      letter-spacing: 0.12em;
      color: var(--rose);
      text-align: center;
      font-weight: 300;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease var(--t-cta-delay), transform 0.8s ease var(--t-cta-delay);
    }
    .card-wrapper.open .cta-text {
      opacity: 1;
      transform: translateY(0);
    }

    .rsvp-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--wax-mid), var(--wax-deep));
      color: rgba(255,248,245,0.96);
      padding: 10px 26px;
      border-radius: 30px;
      text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.85rem, 2.8vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 6px 18px rgba(111,22,50,0.32);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.8s ease var(--t-btn-delay), transform 0.8s ease var(--t-btn-delay),
                  background 0.3s ease, box-shadow 0.3s ease;
      pointer-events: none;
    }
    .rsvp-btn svg { flex-shrink: 0; }
    .rsvp-btn:hover {
      background: linear-gradient(135deg, var(--wax-lite), var(--wax-mid));
      box-shadow: 0 8px 22px rgba(111,22,50,0.44);
    }
    .card-wrapper.open .rsvp-btn {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* =====================================================
       ENVELOPE (overlays the invite card before opening)
    ===================================================== */
    .envelope {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: 14px;
      transition: opacity var(--t-env-dur) ease var(--t-env-delay), transform var(--t-env-dur) ease var(--t-env-delay);
    }
    .card-wrapper.open .envelope {
      opacity: 0;
      transform: translateY(22px) scale(0.95);
    }

    /* Envelope body */
    .env-body {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: linear-gradient(168deg, #fde8f4 0%, #f8eef8 38%, #fde2f2 68%, #f8f0e8 100%);
      border: 2px solid var(--rose);
      box-shadow: 0 14px 45px rgba(200,120,150,0.20), 0 4px 14px rgba(0,0,0,0.07);
      overflow: hidden;
    }

    .env-fold-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Envelope flap (downward triangle, folds open from the top) */
    .env-flap {
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      height: var(--flap-height);
      clip-path: polygon(0 0, 100% 0, 50% 87%);
      background: linear-gradient(178deg, #fcd8ee 0%, #f0cce6 52%, #e8c8ee 100%);
      border-top: 2px solid var(--rose);
      transform-origin: 50% 0%;
      transform-style: preserve-3d;
      transition: transform var(--t-flap-dur) cubic-bezier(0.4, 0, 0.2, 1) var(--t-flap-delay);
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 4px 7px rgba(180,80,120,0.14));
    }
    .card-wrapper.open .env-flap {
      transform: perspective(1400px) rotateX(-172deg);
    }

    /* Wax seal — tip of flap  (--flap-height × clip-tip-y(87%) = --seal-top) */
    .wax-seal {
      position: absolute;
      left: 50%;
      top: var(--seal-top);
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      z-index: 4;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 26%, rgba(255,255,255,0.38) 0 16%, transparent 17% 100%),
        radial-gradient(circle at 68% 72%, rgba(0,0,0,0.28) 0 32%, transparent 58% 100%),
        radial-gradient(circle at 42% 36%, var(--wax-lite) 0%, var(--wax-mid) 38%, var(--wax-deep) 100%);
      box-shadow:
        0 10px 22px rgba(60,8,24,0.44),
        0 3px 0 rgba(255,255,255,0.14) inset;
      filter: drop-shadow(0 3px 2px rgba(0,0,0,0.20));
      clip-path: polygon(
        50% 0%,   56% 5%,  63% 2%,  67% 8%,  74% 6%,
        77% 13%,  84% 12%, 86% 19%, 93% 19%, 94% 27%,
        100% 29%, 99% 37%, 100% 50%,99% 63%, 100% 71%,
        94% 73%, 93% 81%, 86% 81%, 84% 88%, 77% 87%,
        74% 94%, 67% 92%, 63% 98%, 56% 95%,
        50% 100%,44% 95%, 37% 98%, 33% 92%, 26% 94%,
        23% 87%, 16% 88%, 14% 81%, 7% 81%, 6% 73%,
        0% 71%,  1% 63%,  0% 50%,  1% 37%,  0% 29%,
        6% 27%,  7% 19%,  14% 19%, 16% 12%, 23% 13%,
        26% 6%,  33% 8%,  37% 2%,  44% 5%
      );
      display: grid;
      place-items: center;
      overflow: visible;
    }
    .wax-seal::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 22% 28%, rgba(255,255,255,0.10) 0 12%, transparent 13% 100%),
        radial-gradient(circle at 72% 62%, rgba(0,0,0,0.12) 0 14%, transparent 15% 100%),
        repeating-radial-gradient(circle at 42% 44%,
          rgba(255,255,255,0.05) 0 2px,
          rgba(0,0,0,0.04) 2px 4px
        );
      transform: rotate(-8deg);
      opacity: 0.80;
      mix-blend-mode: overlay;
      border-radius: 50%;
    }
    .wax-seal .seal-svg {
      position: relative;
      width: 76px;
      height: 76px;
      z-index: 1;
    }
    .card-wrapper.open .wax-seal {
      animation: sealFade var(--t-seal-fade) ease forwards;
    }
    @keyframes sealFade {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
    }

    /* Postage stamp */
    .env-stamp {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 52px;
      height: 66px;
      z-index: 5;
      filter: drop-shadow(0 2px 5px rgba(100,50,70,0.22));
    }

    /* Corner flowers on the envelope */
    .env-flower {
      position: absolute;
      width: 90px;
      height: 90px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.76;
    }
    .env-flower.tl { top: -6px;   left: -6px; }
    .env-flower.tr { top: -6px;   right: -6px;  transform: scaleX(-1); }
    .env-flower.bl { bottom: -6px; left: -6px;  transform: scaleY(-1); }
    .env-flower.br { bottom: -6px; right: -6px; transform: scale(-1, -1); }

    .env-hint {
      position: absolute;
      bottom: 18px;
      left: 0; right: 0;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      color: var(--dark);
      opacity: 0.52;
      text-transform: uppercase;
      z-index: 6;
      pointer-events: none;
    }

    /* Ripple on click */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(232,160,180,0.35);
      transform: scale(0);
      animation: rippleAnim 0.6s linear forwards;
      pointer-events: none;
      z-index: 10;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }
  </style>
</head>

<script>
  /* ============================================================
     Configuration — replace WEDDING_URL with the actual page
  ============================================================ */
  const WEDDING_URL = 'https://example.com/wedding-details'; // ← update this URL
  document.getElementById('rsvpBtn').href = WEDDING_URL;

  /* ============================================================
     Floating bubbles
  ============================================================ */
  (function spawnBubbles() {
    const container = document.getElementById('bubbles');
    for (let i = 0; i < 26; i++) {
      const el = document.createElement('div');
      el.classList.add('bubble');
      const size   = 8 + Math.random() * 32;
      const drift  = (Math.random() - 0.5) * 80;
      const drift2 = (Math.random() - 0.5) * 40;
      el.style.cssText = [
        `width:${size}px`,
        `height:${size}px`,
        `left:${Math.random() * 100}%`,
        `--drift:${drift}px`,
        `--drift2:${drift2}px`,
        `animation-duration:${10 + Math.random() * 18}s`,
        `animation-delay:${-Math.random() * 28}s`,
      ].join(';');
      container.appendChild(el);
    }
  }());

  /* ============================================================
     Envelope-opening interaction
  ============================================================ */
  const card = document.getElementById('card');
  let opened = false;

  function triggerRipple(e) {
    const rect = card.getBoundingClientRect();
    const x = (e.clientX || rect.left + rect.width  / 2) - rect.left;
    const y = (e.clientY || rect.top  + rect.height / 2) - rect.top;
    const ripple = document.createElement('div');
    ripple.classList.add('ripple');
    const size = Math.max(rect.width, rect.height) * 0.6;
    ripple.style.cssText = `
      width:${size}px; height:${size}px;
      left:${x - size / 2}px; top:${y - size / 2}px;
    `;
    card.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  }

  function openCard(e) {
    if (opened) return;
    opened = true;
    triggerRipple(e);
    // CSS transitions handle the sequence automatically (see :root timing variables):
    // 1. wax seal fades   (0 – --t-seal-fade)
    // 2. flap rotates open (--t-flap-delay – end)
    // 3. envelope fades   (--t-env-delay – end)
    // 4. invite card in   (--t-card-delay – end)
    card.classList.add('open');
  }

  card.addEventListener('click', openCard);
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(e); }
  });

  // Prevent RSVP button clicks from bubbling to the card-wrapper
  document.getElementById('rsvpBtn').addEventListener('click', (e) => {
    e.stopPropagation();
  });
</script>
